<script>
"use strict";
// ================= PHYSICS: custom 2D rigid-body impulse solver (top-down, 1 unit ~ 1 inch) =================
// Ball 16 lb (r 4.3), pins 3.5 lb (r 2.4 belly, 15 tall). Restitution ~0.65, Coulomb friction at contacts.
// Standing pins are discs that topple when an impulse exceeds a threshold; a toppled pin becomes a lying
// capsule (3 circles) that slides and spins and keeps hitting others. Kickback walls bounce pins back.
// Ball: skid on oil -> hook when friction rises (dry back end) -> roll, from lateral rev (side spin).

const SP_MIN=0.5,SP_MAX=1.1,POW_EXP=2.2;const OIL_END=72,MU_OIL=0.0016,MU_DRY=0.0125,REV_MAX=2.0;

const LYING=[[-4.5,2.4],[0.5,1.9],[5.5,1.3]]; // capsule circles: [axial offset from center, radius]
const V_TIP=0.1,SLIDE_MAX=1.2;const I_LY=M_PIN*15*15/12;
let ball,pins,state,frames,t0,mPow,mSpin,lockPow,lockSpin,freeze=false;
let aim={x:DEF_START_X,tx:DEF_START_X};
let RNG=Math.random;
function newRack(){const a=[];for(let r=0;r<4;r++)for(let i=0;i<=r;i++)a.push({x:CX+(i-r/2)*SP,y:PIN_Y+(3-r)*SP*0.866,vx:0,vy:0,down:false});return a;}
function launch(pv,sv){ // pv,sv: meter positions -1..1; small natural variation per throw
 const x=clamp(pv,-1,1),power=(1+Math.sign(x)*Math.abs(x)**POW_EXP)/2,jit=()=>(RNG()*2-1);
 const sp=(SP_MIN+power*(SP_MAX-SP_MIN))*(1+0.02*jit());ball.vy=-sp;
 ball.vx=sp*((aim.tx-ball.x)/(START_Y-AIM_Y)+0.004*jit());
 ball.spin=sv;ball.ws=ball.vx+sv*REV_MAX*(1+0.05*jit());ball.m=M_BALL;ball.hitPins=false;state='roll';}
function bodyCircles(b){if(b===ball)return[[b.x,b.y,BR]];
 if(!b.lying)return[[b.x,b.y,PR]];const c=Math.cos(b.a),s=Math.sin(b.a);return LYING.map(([o,r])=>[b.x+c*o,b.y+s*o,r]);}
function invM(b){return b.gone?0:1/(b===ball?M_BALL:M_PIN);}
function invI(b){return b.lying?1/I_LY:0;}
function topple(p,jx,jy){if(p.lying)return;const l=Math.hypot(jx,jy)||1;p.down=true;p.lying=true;p.a=Math.atan2(jy,jx);

function contact(A,B){if(A.gone||B.gone)return;const ca=bodyCircles(A),cb=bodyCircles(B);
 for(const a of ca)for(const b of cb){const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy),m=a[2]+b[2];if(d>=m||d===0)continue;
  const nx=dx/d,ny=dy/d,cxp=a[0]+nx*a[2],cyp=a[1]+ny*a[2];

  if(A!==ball&&j>TOPPLE_J)topple(A,-Jx,-Jy);if(B!==ball&&j>TOPPLE_J)topple(B,Jx,Jy);for(const q of [A,B])if(q!==ball&&!q.lying&&j>0.15&&j<=TOPPLE_J&&(q.wobT===undefined||q.wobT>=36))q.wobT=0;}}
function walls(p,dt){if(p.gone)return;

  if(p.y<DECK_Y){ // kickbacks (side boards beside the pin deck)
   if(c[0]-c[2]<KICK_L&&p.vx<0){p.x+=KICK_L-(c[0]-c[2]);p.vx=-p.vx*0.5;if(p.lying)p.w*=-0.6;}
   if(c[0]+c[2]>KICK_R&&p.vx>0){p.x-=c[0]+c[2]-KICK_R;p.vx=-p.vx*0.5;if(p.lying)p.w*=-0.6;}}}

}
function ballLane(b,dt){ // skid / hook / roll from lateral rev

 const ox=b.x,oy=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=Math.hypot(b.x-ox,b.y-oy)/BR;
 if(!b.gutter&&(b.x<LX||b.x>LR)){b.gutter=true;b.x=b.x<LX?LX-GW/2:LR+GW/2;b.vx=0;}
 if(b.y<PIT_Y)b.gone=true;
 for(const p of pins){if(p.lying===undefined){p.lying=false;p.w=0;p.a=0;}if(!b.gutter&&!b.gone)contact(b,p);}
 for(let i=0;i<pins.length;i++)for(let j=i+1;j<pins.length;j++)contact(pins[i],pins[j]);
 for(const p of pins){if(p.gone)continue;const fr=p.lying?0.01:0.025;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-fr*dt;p.vy*=1-fr*dt;if(p.lying){const sp=Math.hypot(p.vx,p.vy),dec=0.0022*dt;if(sp<=dec){p.vx=p.vy=0;}else{p.vx-=p.vx/sp*dec;p.vy-=p.vy/sp*dec;}}
  if(p.lying){p.a+=p.w*dt;p.w*=1-0.045*dt;if(Math.abs(p.w)<0.003)p.w=0;}
  else{const sp=Math.hypot(p.vx,p.vy);if(sp>V_TIP){topple(p,p.vx,p.vy);}else if(sp>0){p.slid=(p.slid||0)+sp*dt;p.vx*=1-0.35*dt;p.vy*=1-0.35*dt;if(p.slid>SLIDE_MAX)topple(p,p.vx,p.vy);}}

// ================= SCORING =================
function computeTotals(r){const out=[];let i=0,tot=0;
 for(let f=0;f<10&&i<r.length;f++){
  if(r[i]===10){if(r[i+2]===undefined)break;tot+=10+r[i+1]+r[i+2];i++;}
  else{if(r[i+1]===undefined)break;if(r[i]+r[i+1]===10){if(r[i+2]===undefined)break;tot+=10+r[i+2];}else tot+=r[i]+r[i+1];i+=2;}
  out.push(tot);}return out;}
function applyRoll(G,n){const fr=G.frames[G.f];fr.push(n);let reset=false,over=false;

 else{const a=fr[0],b=fr[1];
  if(fr.length===1)reset=a===10;
  else if(fr.length===2){if(a===10)reset=b===10;else if(a+b===10)reset=true;else over=true;}
  else over=true;}

function newGame(){return{frames:[[],[],[],[],[],[],[],[],[],[]],f:0,fresh:true,over:false};}
let G=newGame();
function marks(fr,tenth){const m=[];
 if(!tenth){if(fr[0]===10)return['','X'];if(fr[0]!==undefined)m.push(fr[0]?''+fr[0]:'-');if(fr[1]!==undefined)m.push(fr[0]+fr[1]===10?'/':fr[1]?''+fr[1]:'-');return m;}

  else{m.push(prev+v===10?'/':v?''+v:'-');fresh=true;}}

// ================= GAME FLOW =================

function setupBall(fullRack){sweepOn=false;aiming=false;heat=clamp(heat,-1,1);

 ball={x:aim.x,y:START_Y,vx:0,vy:0,gutter:false,spin:0,rot:0};
 state='aim';frames=0;t0=now();lockPow=lockSpin=null;sweep=0;banner=null;sub2='';}
function reset(){G=newGame();heat=0;recent=[];setupBall(true);}
const now=()=>performance.now();
function osc(ms){const t=((now()-t0)/ms)%2;return t<1?t*2-1:3-t*2;}
let btnPress=0;
function press(){btnPress=6;
 if(state==='aim'){if(aiming)return;if(!sweepOn){startSweep();return;}state='spin';t0=now();}
 else if(state==='spin'){lockSpin=mSpin;state='power';t0=now();}

let doneT=0;const PINW=1.0;
function finish(){doneT=0;

 if(!fresh&&n<standing)heat-=0.2;

 else if(split){slowUntil=now()+3000;big='SPLIT!';col='#f84';}

 else{big=n+(n===1?' PIN':' PINS');col='#fff';}
 lastMsg=n===10&&fresh?'STRIKE! 10 pins!':n+' pin'+(n===1?'':'s')+' down'+(split?' - SPLIT!':'')+(ball.gutter&&n===0?' (gutter!)':'');
 banner={t:0,text:big,col};
 if(over){const tot=computeTotals(G.frames.flat());sub2='FINAL SCORE '+tot[tot.length-1];state='over';}else state='done';}

let W=195,H=422,S=2,SAT=0,SAB=0;
const cv=document.getElementById('c'),g=cv.getContext('2d');

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
// ---- 3x5 pixel font

const FORDER="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 !?.,:-+/'()#%x";const FTINT={};

 for(let i=0;i<str.length;i++){const ch=str[i];const c=banner.col==='rainbow'?['#ff4a4a','#ffb02e','#ffe94a','#5be05b','#4ad0ff','#b07cff'][(i+(t>>2))%6]:banner.col;

 const endY=AIM_Y-22,dir=(aim.tx-ball.x)/(START_Y-AIM_Y),pt=ly=>proj(ball.x+dir*(START_Y-ly),ly);

 for(let i=1;i<n;i++){const t=(i+ph)/n,ly=START_Y-6-(START_Y-6-endY)*t,q=pt(ly),r=Math.max(2,Math.round(q.s*SCL*0.55));
